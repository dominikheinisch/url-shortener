name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.13"
      - run: uv sync --frozen
      - name: fmt
        run: uv run ruff format --check .
      - name: lint
        run: uv run ruff check .
      - name: mypy
        run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: shortener
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortener"
          --health-interval 2s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.13"
      - run: uv sync --frozen
      - name: test
        run: uv run pytest
